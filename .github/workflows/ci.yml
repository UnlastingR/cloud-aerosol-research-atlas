name: Cloud Atlas · cloud build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-atlas-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate TypeScript and build Vite
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-atlas-dist
          path: dist/
          retention-days: 30
          if-no-files-found: error
